name: Build CSQTT Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'amurcanov/csqtt'
          path: 'src'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Server
        run: |
          cd src/rust-server
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-server-binary
          path: src/rust-server/target/x86_64-unknown-linux-musl/release/csqtt
